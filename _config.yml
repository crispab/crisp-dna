title: Crisp DNA
description: The inner workings of a rather different consulting company
url: https://dna.crisp.se
lang: en
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
      description: "The inner workings of a rather different consulting company"
  -
    scope:
      type: docs
    values:
      seo:
        type: WebPage
  -
    scope:
      path: "googleaa11fc69f16597c5.html"
    values:
      sitemap: false
  -
    scope:
      path: "index.html"
    values:
      sitemap: false
collections:
  docs:
    output: true
company_name: "Crisp"
hero_images:
  - assets/hero/dna-people-1.webp
  - assets/hero/dna-people-2.webp
  - assets/hero/dna-people-3.webp
  - assets/hero/dna-people-4.webp
exclude:
  - CLAUDE.md
  - README.md
  - run
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor