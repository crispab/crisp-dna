<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://fonts.googleapis.com/css?family=Architects+Daughter' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" type="text/css" href="{{site.baseurl}}/stylesheets/stylesheet.css" media="screen">
    <link rel="stylesheet" type="text/css" href="{{site.baseurl}}/stylesheets/pygment_trac.css" media="screen">
    <link rel="stylesheet" type="text/css" href="{{site.baseurl}}/stylesheets/print.css" media="print">
    <link rel="shortcut icon" href="{{site.baseurl}}/images/crisp_logo_C_48x48png.png" type="image/png" />

    {% seo %}
  </head>
    <body>  
      
      <header>
        <div class="inner">
			
          <h1><a href="{{ site.baseurl }}/">{{ site.title }}</a></h1>
          <h2>{{ site.description }}</h2>
          <a href="https://github.com/crispab/crisp-dna" class="button"><small>View project on</small> GitHub</a>
        </div>
		
      </header>


      <div id="content-wrapper">
        <div class="inner clearfix">
          <section id="main-content">
          
	        {{content}}
          {% include section_nav.html %}	  
  
          </section>

          
          <aside id="sidebar">
            {% include docs_contents.html %}

            <a href="https://github.com/crispab/crisp-dna/archive/gh-pages.zip" class="button">
              <small>Download</small>
              .zip file
            </a>

            <p class="repo-owner"><a href="https://github.com/crispab/crisp-dna"></a> is maintained by <a href="https://github.com/crispab">crispab</a>.</p>

            <p>This page was generated by <a href="https://pages.github.com">GitHub Pages</a>. Layout based on a theme from <a href="https://twitter.com/jasonlong">Jason Long</a>.</p>
          </aside>
          
        </div>
      </div>


      <footer>
      </footer>
    </body>
</html>
